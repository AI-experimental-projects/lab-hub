# Weekly dependency PRs. Minor/patch bumps are grouped per ecosystem so the queue
# stays small; majors arrive one by one. PRs run CI without secrets.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      app-minor:
        update-types: [minor, patch]
    ignore:
      # Types follow the Node version we run (24 LTS), not the newest Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /infra/edge
    schedule: { interval: weekly, day: monday }
    groups:
      edge-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    ignore:
      # Stay on Node LTS; majors (including odd, non-LTS ones) are bumped by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]
