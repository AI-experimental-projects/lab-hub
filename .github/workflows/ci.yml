name: CI

on:
  push:
    branches: [main]
  pull_request:

# PRs (including forks) get read-only access and no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails if any lab.yaml breaks the contract.
      - run: pnpm validate
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build

  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ai-experimental-projects/lab-hub
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Points web.yaml at the image just published. Flux (inside the cluster) picks
  # up the commit and rolls it out; GitHub never talks to the cluster.
  # Pushes made with GITHUB_TOKEN don't trigger new workflow runs, so this can't loop.
  deploy:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 20
      - name: Bump image tag
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="sha-${SHA::7}"

          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            # A newer code commit landed after this one: its own run will deploy it.
            latest=$(git log -1 --format=%H --invert-grep --grep='^deploy: ' origin/main)
            if [ "$latest" != "$SHA" ]; then
              echo "main moved past $SHA; skipping"; exit 0
            fi
            sed -i -E "s#(ghcr.io/ai-experimental-projects/lab-hub):sha-[0-9a-f]+#\1:${tag}#" infra/k8s/lab-hub/web.yaml
            if git diff --quiet; then echo "already at $tag"; exit 0; fi
            git commit -qam "deploy: web ${tag}"
            git push -q origin HEAD:main && { echo "deployed $tag"; exit 0; }
            sleep $((attempt * 5))
          done
          echo "could not push after 3 attempts" >&2; exit 1
