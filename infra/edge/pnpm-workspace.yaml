# Standalone package (not part of the root workspace).
# Build scripts stay off: wrangler deploy only needs esbuild's prebuilt binary;
# workerd is for local `wrangler dev`.
allowBuilds:
  esbuild: false
  workerd: false

# Patched undici for wrangler's local dev server (miniflare): GHSA DoS/SRI fixes.
overrides:
  undici: ">=7.30.1"
