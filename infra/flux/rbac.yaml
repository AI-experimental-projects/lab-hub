# The identity Flux deploys as. It gets the built-in `admin` role only inside the
# app namespaces: it cannot touch kube-system, flux-system, cluster-scoped objects
# (namespaces, CRDs, ClusterRoles) or any other namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-deployer
  namespace: lab-hub
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-deployer
  namespace: cloudflared
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
