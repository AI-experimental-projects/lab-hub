# Nothing gets in or out of lab-hub unless allowed below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: lab-hub
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Only the tunnel connector may reach the web pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-cloudflared
  namespace: lab-hub
spec:
  podSelector:
    matchLabels: { app: hello }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cloudflared }
          podSelector:
            matchLabels: { app: cloudflared }
      ports:
        - { protocol: TCP, port: 8080 }
