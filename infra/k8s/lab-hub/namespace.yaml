apiVersion: v1
kind: Namespace
metadata:
  name: lab-hub
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
# Nothing gets in or out of lab-hub unless another policy allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: lab-hub
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
